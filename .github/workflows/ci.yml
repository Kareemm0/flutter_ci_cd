name: Flutter CI/CD

on: 
    push: 
        branches: 
            - main 

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name : checkout code 
              uses: actions/checkout@v3
            - name: install dependancies
              run: flutter pub get 
              
            - name: Build Apk
              run: flutter build apk --split-per-abi
              
            - name: Upload Apk
              uses: actions/upload-artifacts@v3
              with: 
                name: App Apk 
                path: build/app/outputs/flutter-apk/app-release.apk
